<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Dashboard — Produtos</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  padding: 30px;
}

.card {
  max-width: 1000px;
  margin: auto;
  background: #fff;
  padding: 20px;
  border-radius: 8px;
  margin-bottom: 30px;
}

input {
  padding: 8px;
  margin-right: 5px;
}

button {
  padding: 6px 10px;
  border: none;
  border-radius: 5px;
  background: #1976d2;
  color: #fff;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 15px;
}

th, td {
  padding: 10px;
  border-bottom: 1px solid #ddd;
  text-align: center;
}

th {
  background: #f1f1f1;
}

/* MODAL */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  align-items: center;
  justify-content: center;
}

.modal-content {
  background: #fff;
  padding: 20px;
  border-radius: 8px;
  width: 300px;
}
</style>
</head>

<body>

<!-- ================= CADASTRAR PRODUTO ================= -->
<div class="card">
  <h2>Cadastrar Produto</h2>

  <input id="nomeProduto" placeholder="Nome do produto">
  <input id="precoProduto" type="number" step="0.01" placeholder="Preço">

  <button onclick="cadastrarProduto()">Cadastrar</button>

  <p id="msgProduto"></p>
</div>

<!-- ================= PRODUTOS ================= -->
<div class="card">
  <h2>Produtos Cadastrados</h2>

  <table>
    <thead>
      <tr>
        <th>Nome</th>
        <th>Preço</th>
        <th>Ação</th>
      </tr>
    </thead>
    <tbody id="tabelaProdutos">
      <tr><td colspan="3">Carregando...</td></tr>
    </tbody>
  </table>
</div>

<!-- ================= PRODUTOS DO DIA ================= -->
<div class="card">
  <h2>Produtos do Dia</h2>

  <table>
    <thead>
      <tr>
        <th>Nome</th>
        <th>Preço</th>
        <th>Quantidade</th>
      </tr>
    </thead>
    <tbody id="tabelaProdutosDia">
      <tr><td colspan="3">Carregando...</td></tr>
    </tbody>
  </table>
</div>

<!-- ================= MODAL ================= -->
<div class="modal" id="modalQtd">
  <div class="modal-content">
    <h3>Adicionar Produto ao Dia</h3>

    <p id="produtoSelecionado"></p>

    <input
      type="number"
      id="inputQtd"
      min="1"
      placeholder="Quantidade"
    >

    <br><br>
    <button onclick="confirmarAdicionar()">Confirmar</button>
    <button onclick="fecharModal()">Cancelar</button>
  </div>
</div>

<script>
let produtoNomeAtual = "";
let produtoPrecoAtual = 0;

/* ================= CADASTRAR PRODUTO ================= */
async function cadastrarProduto() {
  const nome = document.getElementById("nomeProduto").value.trim();
  const preco = document.getElementById("precoProduto").value;

  if (!nome || !preco) {
    alert("Preencha todos os campos");
    return;
  }

  const res = await fetch("/produto", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ nome, preco })
  });

  if (!res.ok) {
    alert("Erro ao cadastrar produto");
    return;
  }

  document.getElementById("msgProduto").innerText =
    "Produto cadastrado com sucesso";

  document.getElementById("nomeProduto").value = "";
  document.getElementById("precoProduto").value = "";

  carregarProdutos();
}

/* ================= LISTAR PRODUTOS ================= */
async function carregarProdutos() {
  const res = await fetch("/produto");
  const produtos = await res.json();

  const tbody = document.getElementById("tabelaProdutos");

  tbody.innerHTML = produtos.map(p => `
    <tr>
      <td>${p.nome}</td>
      <td>R$ ${Number(p.preco).toFixed(2)}</td>
      <td>
        <button onclick="abrirModal('${p.nome}', ${p.preco})">
          Adicionar ao Dia
        </button>
      </td>
    </tr>
  `).join("");
}

/* ================= PRODUTOS DO DIA ================= */
async function carregarProdutosDia() {
  const res = await fetch("/produtos_dia");
  const produtos = await res.json();

  const tbody = document.getElementById("tabelaProdutosDia");

  tbody.innerHTML = produtos.map(p => `
    <tr>
      <td>${p.nome}</td>
      <td>R$ ${Number(p.preco).toFixed(2)}</td>
      <td>${p.qtd}</td>
    </tr>
  `).join("");
}


/* ================= MODAL ================= */
function abrirModal(nome, preco) {
  produtoNomeAtual = nome;
  produtoPrecoAtual = preco;

  document.getElementById("produtoSelecionado").innerText =
    `${nome} — R$ ${Number(preco).toFixed(2)}`;

  document.getElementById("inputQtd").value = 1;
  document.getElementById("modalQtd").style.display = "flex";
}

function fecharModal() {
  document.getElementById("modalQtd").style.display = "none";
}

/* ================= ADD AO DIA ================= */
async function confirmarAdicionar() {
  const qtd = Number(document.getElementById("inputQtd").value);

  if (!qtd || qtd <= 0) {
    alert("Quantidade inválida");
    return;
  }

  const res = await fetch("/produto_dia", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      nome: produtoNomeAtual,
      preco: produtoPrecoAtual,
      qtd: qtd
    })
  });

  const data = await res.json();

  if (!res.ok) {
    alert(data.erro || "Erro ao adicionar produto");
    return;
  }

  fecharModal();
  carregarProdutosDia();
}

/* INIT */
carregarProdutos();
carregarProdutosDia();
</script>

</body>
</html>
