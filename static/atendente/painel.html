<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Painel Administrativo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #f5f7fa 0%, #e9ecef 100%); color: #1e293b; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
        .container { max-width: 1400px; padding: 1.5rem; }
        .card { border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); background: #fff; border: 1px solid #e2e8f0; }
        .card-body { padding: 1.5rem; }
        h2.fw-bold { font-size: 1.8rem; background: linear-gradient(135deg, #0f172a 0%, #334155 100%); -webkit-background-clip: text; background-clip: text; color: transparent; border-left: 4px solid #3b82f6; padding-left: 1rem; margin-bottom: 1.5rem; }
        .table { color: #1e293b; border-color: #e2e8f0; }
        .table th { background: #f1f5f9; color: #0f172a; text-transform: uppercase; font-size: 0.75rem; padding: 12px 8px; }
        .table td { background: #fff; padding: 12px 8px; vertical-align: middle; }
        .table-hover tbody tr:hover td { background-color: #f8fafc; }
        .table-dark th { background: #1e293b !important; color: #fff; }
        .table-success th { background: #dcfce7 !important; color: #166534; }
        .table-info th { background: #dbeafe !important; color: #1e40af; }
        .coxa-sobrecoxa { background-color: #fef9c3 !important; }
        .coxa-sobrecoxa td { background-color: #fef9c3 !important; color: #854d0e; }
        .badge-pares { background: #3b82f6; color: white; font-size: 0.7rem; padding: 4px 10px; border-radius: 20px; margin-left: 8px; }
        .valor-normal { color: #16a34a; font-weight: 600; }
        .valor-promocao { color: #dc2626; font-weight: 600; background: #fee2e2; padding: 4px 12px; border-radius: 20px; display: inline-block; }
        .form-control { background: #fff; border: 1px solid #cbd5e1; border-radius: 10px; padding: 10px 14px; }
        .form-control:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.1); }
        .console-log { background: #0f172a; color: #a5f3fc; font-family: monospace; padding: 15px; border-radius: 12px; max-height: 200px; overflow-y: auto; font-size: 12px; margin-bottom: 15px; }
        .btn { border-radius: 10px; font-weight: 500; padding: 8px 16px; transition: all 0.2s; }
        .btn-primary { background: #3b82f6; border-color: #3b82f6; }
        .btn-primary:hover { background: #2563eb; transform: translateY(-1px); }
        .btn-success { background: #22c55e; border-color: #22c55e; }
        .btn-danger { background: #ef4444; border-color: #ef4444; }
        .nav-tabs { border-bottom: 2px solid #e2e8f0; gap: 4px; }
        .nav-tabs .nav-link { color: #475569; background: transparent; border: none; padding: 12px 24px; font-weight: 500; border-radius: 12px 12px 0 0; }
        .nav-tabs .nav-link:hover { background: #f1f5f9; }
        .nav-tabs .nav-link.active { background: #fff; color: #3b82f6; border-bottom: 2px solid #3b82f6; }
        .table-primary { background: #dbeafe !important; }
        .table-primary td { background: #dbeafe !important; color: #1e40af; font-weight: 600; }
        @media (max-width: 768px) { .nav-tabs .nav-link { padding: 8px 16px; font-size: 0.8rem; } .table th, .table td { padding: 8px 4px; font-size: 0.75rem; } }
    </style>
</head>
<body>

<div class="container my-4">
    <h2 class="fw-bold mb-4">📊 Painel Administrativo</h2>

    <div class="mb-2">
        <button class="btn btn-sm btn-secondary" onclick="toggleLogs()">🖥️ Mostrar Logs</button>
        <button class="btn btn-sm btn-warning" onclick="limparLogs()">🧹 Limpar Logs</button>
    </div>

    <div id="consoleLogs" class="console-log" style="display: none;"><div id="logMessages"></div></div>

    <ul class="nav nav-tabs mb-3">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#abertos">📋 Pedidos Abertos</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#finalizados">✅ Pedidos Finalizados</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#produtosCliente">📦 Produtos do Cliente</button></li>
    </ul>

    <div class="tab-content">
        <!-- PEDIDOS ABERTOS -->
        <div class="tab-pane fade show active" id="abertos">
            <div class="card">
                <div class="card-body">
                    <div class="row mb-3">
                        <div class="col-md-4"><input type="text" id="filtroNomeAbertos" class="form-control" placeholder="Nome do cliente"></div>
                        <div class="col-md-2"><button class="btn btn-primary w-100" onclick="filtrarPedidosAbertos()">🔍 Buscar</button></div>
                        <div class="col-md-2"><button class="btn btn-secondary w-100" onclick="carregarPedidosAbertos()">🔄 Limpar</button></div>
                        <div class="col-md-4 text-end"><button class="btn btn-danger btn-sm" onclick="deletarTodosPedidosAbertos()">🗑 Excluir Todos</button></div>
                    </div>
                    <div id="erroAbertos" class="alert alert-danger" style="display: none;"></div>
                    <div class="table-responsive">
                        <table class="table table-bordered table-hover">
                            <thead class="table-dark"><tr><th>ID</th><th>Cliente</th><th>Valor</th><th>Data</th><th class="text-center">Ações</th></tr></thead>
                            <tbody id="tabelaAbertos"><tr><td colspan="5" class="text-center text-muted">Carregando...</td></tr></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- PEDIDOS FINALIZADOS -->
        <div class="tab-pane fade" id="finalizados">
            <div class="card">
                <div class="card-body">
                    <div class="row mb-3">
                        <div class="col-md-4"><input type="text" id="filtroNomeFinalizados" class="form-control" placeholder="Nome do cliente"></div>
                        <div class="col-md-2"><button class="btn btn-primary w-100" onclick="filtrarPedidosFinalizados()">🔍 Buscar</button></div>
                        <div class="col-md-2"><button class="btn btn-secondary w-100" onclick="carregarPedidosFinalizados()">🔄 Limpar</button></div>
                        <div class="col-md-4 text-end">
                            <button class="btn btn-outline-primary btn-sm me-2" onclick="imprimirPedidosFinalizados()">🖨 Imprimir</button>
                            <button class="btn btn-danger btn-sm" onclick="deletarPedidosFinalizados()">🗑 Deletar Todos</button>
                        </div>
                    </div>
                    <div id="erroFinalizados" class="alert alert-danger" style="display: none;"></div>
                    <div class="table-responsive">
                        <table class="table table-bordered table-hover">
                            <thead class="table-success"><tr><th>ID</th><th>Cliente</th><th>Valor</th><th>Data Finalização</th></tr></thead>
                            <tbody id="tabelaFinalizados"><tr><td colspan="4" class="text-center text-muted">Carregando...</td></tr></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- PRODUTOS DO CLIENTE -->
        <div class="tab-pane fade" id="produtosCliente">
            <div class="card">
                <div class="card-body">
                    <div class="row mb-3">
                        <div class="col-md-4"><input type="text" id="filtroNomeProdutosCliente" class="form-control" placeholder="Nome do cliente"></div>
                        <div class="col-md-2"><button class="btn btn-primary w-100" onclick="filtrarProdutosCliente()">🔍 Buscar</button></div>
                        <div class="col-md-2"><button class="btn btn-secondary w-100" onclick="carregarProdutosCliente()">🔄 Limpar</button></div>
                        <div class="col-md-4 text-end">
                            <button class="btn btn-danger btn-sm me-2" onclick="deletarProdutosCliente()">🗑 Excluir Todos</button>
                            <button class="btn btn-info btn-sm" onclick="exportarProdutosCliente()">📊 Exportar</button>
                        </div>
                    </div>
                    <div id="erroProdutos" class="alert alert-danger" style="display: none;"></div>
                    <div class="alert alert-info small">ℹ️ Coxa/Sobrecoxa: Quantidade em PARES. Tabela: 1=R$10 | 2=R$20 | 3=R$25 | 4=R$35 | 5=R$40 | 6=R$50 | 7+=R$50 + R$10/par</div>
                    <div class="table-responsive">
                        <table class="table table-bordered table-hover">
                            <thead class="table-info"><tr><th>ID</th><th>Cliente</th><th>Produto</th><th>Quantidade</th><th>Pares</th><th>Valor</th></tr></thead>
                            <tbody id="tabelaProdutosCliente"><tr><td colspan="6" class="text-center text-muted">Carregando...</td></tr></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
const API = "https://vendas-svoq.onrender.com/";
let logsVisiveis = false;
let precosProdutos = {};

function addLog(mensagem, tipo = 'info') {
    const logDiv = document.getElementById('logMessages');
    const timestamp = new Date().toLocaleTimeString('pt-BR');
    let cor = '#22c55e';
    if (tipo === 'error') cor = '#ef4444';
    if (tipo === 'warning') cor = '#f59e0b';
    logDiv.innerHTML += `<div style="color: ${cor}">[${timestamp}] ${mensagem}</div>`;
    document.getElementById('consoleLogs').scrollTop = document.getElementById('consoleLogs').scrollHeight;
    console.log(`[${timestamp}] ${mensagem}`);
}

function toggleLogs() { logsVisiveis = !logsVisiveis; document.getElementById('consoleLogs').style.display = logsVisiveis ? 'block' : 'none'; }
function limparLogs() { document.getElementById('logMessages').innerHTML = ''; addLog('🧹 Logs limpos', 'info'); }

function formatarDataBR(data) {
    if (!data) return "";
    if (typeof data === 'string' && data.includes('-')) {
        const partes = data.split('T')[0].split('-');
        if (partes.length === 3) return `${partes[2]}/${partes[1]}/${partes[0]}`;
    }
    try {
        const d = new Date(data);
        if (!isNaN(d.getTime())) return d.toLocaleDateString('pt-BR');
    } catch(e) {}
    return data;
}

function isCoxaSobrecoxa(produto) {
    if (!produto) return false;
    const nome = typeof produto === 'string' ? produto : produto.produto || '';
    return nome.toLowerCase().includes('coxa') && nome.toLowerCase().includes('sobrecoxa');
}

function calcularPrecoCoxaSobrecoxa(pares) {
    if (pares <= 0) return 0;
    if (pares === 1) return 10;
    if (pares === 2) return 20;
    if (pares === 3) return 25;
    if (pares === 4) return 35;
    if (pares === 5) return 40;
    if (pares === 6) return 50;
    return 50 + ((pares - 6) * 10);
}

async function fetchComTratamento(url, errorId) {
    try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (errorId) document.getElementById(errorId).style.display = 'none';
        return data;
    } catch (error) {
        addLog(`❌ Erro: ${error.message}`, 'error');
        if (errorId) {
            const div = document.getElementById(errorId);
            div.style.display = 'block';
            div.innerHTML = `❌ Erro: ${error.message}`;
        }
        return [];
    }
}

async function carregarPrecosProdutos() {
    try {
        const res = await fetch(`${API}/produto_dia`);
        const produtos = await res.json();
        if (Array.isArray(produtos)) produtos.forEach(p => precosProdutos[p.nome.toLowerCase()] = p.preco);
        addLog(`✅ Preços carregados: ${produtos.length} produtos`);
    } catch (error) { addLog(`⚠️ Erro ao carregar preços: ${error.message}`, 'warning'); }
}

// PEDIDOS ABERTOS
async function carregarPedidosAbertos() {
    addLog('📋 Carregando pedidos abertos...', 'info');
    const dados = await fetchComTratamento(`${API}/pedidos`, 'erroAbertos');
    renderPedidosAbertos(dados);
}
async function filtrarPedidosAbertos() {
    const nome = document.getElementById('filtroNomeAbertos').value.trim();
    if (!nome) return alert("Digite o nome");
    const dados = await fetchComTratamento(`${API}/pedidos/filtrar?nome=${encodeURIComponent(nome)}`, 'erroAbertos');
    renderPedidosAbertos(dados);
}
function renderPedidosAbertos(dados) {
    const tabela = document.getElementById('tabelaAbertos');
    if (!dados || dados.length === 0) { tabela.innerHTML = '<tr><td colspan="5" class="text-center text-muted">Nenhum pedido aberto</td></tr>'; return; }
    tabela.innerHTML = '';
    dados.forEach(p => {
        tabela.innerHTML += `<tr><td class="fw-bold">${p.id}</td><td>${p.nome_cliente}</td><td class="text-end">R$ ${Number(p.valor_total).toFixed(2)}</td><td class="text-center">${formatarDataBR(p.data_pedido)}</td>
        <td class="text-center"><button class="btn btn-success btn-sm me-1" onclick="finalizarPedido(${p.id})">✔ Finalizar</button><button class="btn btn-danger btn-sm" onclick="excluirPedido(${p.id})">🗑 Excluir</button></td></tr>`;
    });
}
async function deletarTodosPedidosAbertos() {
    if (!confirm("Excluir TODOS os pedidos abertos?")) return;
    const dados = await fetchComTratamento(`${API}/pedidos`, 'erroAbertos');
    if (dados && Array.isArray(dados)) {
        for (const p of dados) await fetch(`${API}/pedido/${p.id}`, { method: "DELETE" });
        addLog(`✅ ${dados.length} pedidos excluídos`);
        carregarPedidosAbertos();
    }
}

// PEDIDOS FINALIZADOS
async function carregarPedidosFinalizados() {
    addLog('📋 Carregando pedidos finalizados...', 'info');
    const dados = await fetchComTratamento(`${API}/pedidos_finalizados`, 'erroFinalizados');
    renderPedidosFinalizados(dados);
}
async function filtrarPedidosFinalizados() {
    const nome = document.getElementById('filtroNomeFinalizados').value.trim();
    if (!nome) return alert("Digite o nome");
    const dados = await fetchComTratamento(`${API}/pedidos_finalizados/filtrar?nome=${encodeURIComponent(nome)}`, 'erroFinalizados');
    renderPedidosFinalizados(dados);
}
function renderPedidosFinalizados(dados) {
    const tabela = document.getElementById('tabelaFinalizados');
    if (!dados || dados.length === 0) { tabela.innerHTML = '<tr><td colspan="4" class="text-center text-muted">Nenhum pedido finalizado</td></tr>'; return; }
    tabela.innerHTML = '';
    dados.forEach(p => {
        const dataFin = p.data_finalizacao || p.data_pedido;
        tabela.innerHTML += `<tr><td class="fw-bold">${p.id}</td><td>${p.nome_cliente}</td><td class="text-end">R$ ${Number(p.valor_total).toFixed(2)}</td><td class="text-center">${formatarDataBR(dataFin)}</td></tr>`;
    });
}
function imprimirPedidosFinalizados() {
    const tabela = document.querySelector("#finalizados table").outerHTML;
    const janela = window.open("", "", "width=900,height=700");
    janela.document.write(`<html><head><title>Pedidos Finalizados</title><style>body{font-family:Arial;padding:20px}th,td{border:1px solid #ddd;padding:8px}th{background:#f1f5f9}</style></head><body><h2>Pedidos Finalizados</h2>${tabela}</body></html>`);
    janela.document.close();
    janela.print();
}
async function deletarPedidosFinalizados() {
    if (!confirm("Excluir TODOS os pedidos finalizados?")) return;
    const res = await fetch(`${API}/pedido/deletar`, { method: "DELETE" });
    if (res.ok) { addLog(`✅ Pedidos finalizados excluídos`); carregarPedidosFinalizados(); }
    else addLog(`❌ Erro ao excluir`, 'error');
}

// PRODUTOS CLIENTE
async function carregarProdutosCliente() {
    await carregarPrecosProdutos();
    const dados = await fetchComTratamento(`${API}/produtos_cliente`, 'erroProdutos');
    renderProdutosCliente(dados);
}
async function filtrarProdutosCliente() {
    const nome = document.getElementById('filtroNomeProdutosCliente').value.trim();
    if (!nome) return alert("Digite o nome");
    await carregarPrecosProdutos();
    const dados = await fetchComTratamento(`${API}/produtos_cliente/filtrar?nome=${encodeURIComponent(nome)}`, 'erroProdutos');
    renderProdutosCliente(dados);
}
function renderProdutosCliente(dados) {
    const tabela = document.getElementById('tabelaProdutosCliente');
    if (!dados || dados.length === 0) { tabela.innerHTML = '<tr><td colspan="6" class="text-center text-muted">Nenhum produto encontrado</td></tr>'; return; }
    tabela.innerHTML = '';
    let totalGeral = 0;
    dados.forEach(item => {
        const qtd = Number(item.qtd);
        const ehCoxa = isCoxaSobrecoxa(item.produto);
        const preco = precosProdutos[item.produto.toLowerCase()] || 0;
        const valor = ehCoxa ? calcularPrecoCoxaSobrecoxa(qtd) : qtd * preco;
        totalGeral += valor;
        const classe = ehCoxa ? 'coxa-sobrecoxa' : '';
        const pares = ehCoxa ? `<span class="badge-pares">${qtd} par(es)</span>` : '-';
        const valorDisplay = ehCoxa ? `<span class="valor-promocao">R$ ${valor.toFixed(2)}</span>` : `<span class="valor-normal">R$ ${valor.toFixed(2)}</span>`;
        tabela.innerHTML += `<tr class="${classe}"><td>${item.id}</td><td><strong>${item.cliente}</strong></td><td>${item.produto}</td><td>${ehCoxa ? qtd + ' par(es)' : qtd.toFixed(3)}</td><td>${pares}</td><td>${valorDisplay}</td></tr>`;
    });
    tabela.innerHTML += `<tr class="table-primary"><td colspan="5" class="text-end"><strong>TOTAL GERAL:</strong></td><td><strong>R$ ${totalGeral.toFixed(2)}</strong></td></tr>`;
}
async function deletarProdutosCliente() {
    if (!confirm("Excluir TODOS os produtos?")) return;
    const res = await fetch(`${API}/produto/deletar`, { method: "DELETE" });
    if (res.ok) { addLog(`✅ Todos produtos excluídos`); carregarProdutosCliente(); }
    else addLog(`❌ Erro ao excluir`, 'error');
}
function exportarProdutosCliente() {
    const tabela = document.querySelector('#produtosCliente table').outerHTML;
    const janela = window.open('', '', 'width=800,height=600');
    janela.document.write(`<html><head><title>Produtos do Cliente</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"><style>.coxa-sobrecoxa{background:#fef9c3}</style></head><body><div class="container mt-3">${tabela}</div></body></html>`);
}

// AÇÕES
async function finalizarPedido(id) {
    if (!confirm("Finalizar pedido?")) return;
    const hoje = new Date();
    const data = `${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,'0')}-${String(hoje.getDate()).padStart(2,'0')}`;
    try {
        const res = await fetch(`${API}/pedido/${id}/finalizar`, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ data_finalizacao: data })
        });
        if (res.ok) { addLog(`✅ Pedido ${id} finalizado`); carregarPedidosAbertos(); carregarPedidosFinalizados(); }
        else alert("Erro ao finalizar");
    } catch (error) { alert(`Erro: ${error.message}`); }
}
async function excluirPedido(id) {
    if (!confirm("Excluir pedido?")) return;
    const res = await fetch(`${API}/pedido/${id}`, { method: "DELETE" });
    if (res.ok) { addLog(`✅ Pedido ${id} excluído`); carregarPedidosAbertos(); }
    else alert("Erro ao excluir");
}

document.addEventListener('DOMContentLoaded', () => {
    addLog('🚀 Painel Administrativo iniciado');
    carregarPedidosAbertos();
    carregarPedidosFinalizados();
    carregarProdutosCliente();
});
</script>
</body>
</html>
