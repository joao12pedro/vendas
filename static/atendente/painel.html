<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    padding: 20px;
}

h1 {
    text-align: center;
}

.tabs {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 20px;
}

.tab {
    padding: 10px 16px;
    background: #ddd;
    border-radius: 6px;
    cursor: pointer;
    font-weight: bold;
}

.tab.active {
    background: #1976d2;
    color: #fff;
}

section {
    display: none;
    max-width: 1100px;
    margin: auto;
}

section.active {
    display: block;
}

.topo {
    display: flex;
    justify-content: space-between;
    margin-bottom: 10px;
    gap: 10px;
}

input {
    padding: 8px;
    width: 260px;
}

button {
    padding: 8px 12px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
}

.btn-fin { background: #2e7d32; color: #fff; }
.btn-del { background: #d32f2f; color: #fff; }
.btn-print { background: #455a64; color: #fff; }
.btn-limpar { background: #ef6c00; color: #fff; }

table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
}

th, td {
    border: 1px solid #ddd;
    padding: 8px;
}
</style>
</head>

<body>

<h1>Painel de Pedidos</h1>

<div class="tabs">
    <div class="tab active" onclick="abrirAba('abertos', this)">Pedidos Abertos</div>
    <div class="tab" onclick="abrirAba('finalizados', this)">Pedidos Finalizados</div>
    <div class="tab" onclick="abrirAba('clientes', this)">Produtos do Cliente</div>
</div>

<!-- PEDIDOS ABERTOS -->
<section id="abertos" class="active">
    <div class="topo">
        <input id="buscaAbertos" placeholder="Buscar cliente">
        <button onclick="buscarAbertos()">Buscar</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Cliente</th>
                <th>Total</th>
                <th>Data</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabela-abertos"></tbody>
    </table>
</section>

<!-- FINALIZADOS -->
<section id="finalizados">
    <div class="topo">
        <input id="buscaFinalizados" placeholder="Buscar cliente">
        <div>
            <button class="btn-print" onclick="imprimir()">Imprimir</button>
            <button class="btn-limpar" onclick="limparFinalizados()">Limpar</button>
        </div>
    </div>

    <table id="tabela-impressao">
        <thead>
            <tr>
                <th>ID</th>
                <th>Cliente</th>
                <th>Total</th>
                <th>Data</th>
            </tr>
        </thead>
        <tbody id="tabela-finalizados"></tbody>
    </table>
</section>

<!-- PRODUTOS CLIENTE -->
<section id="clientes">
    <div class="topo">
        <input id="buscaCliente" placeholder="Buscar cliente ou produto">
        <div>
            <button onclick="buscarClientes()">Buscar</button>
            <button class="btn-del" onclick="deletarProdutosCliente()">Deletar todos</button>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Cliente</th>
                <th>Produto</th>
            </tr>
        </thead>
        <tbody id="tabela-clientes"></tbody>
    </table>
</section>

<script>
/* ---------- ABAS ---------- */
function abrirAba(id, el) {
    document.querySelectorAll("section").forEach(s => s.classList.remove("active"));
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.getElementById(id).classList.add("active");
    el.classList.add("active");

    if (id === "abertos") carregarAbertos();
    if (id === "finalizados") carregarFinalizados();
    if (id === "clientes") carregarClientes();
}

/* ---------- ABERTOS ---------- */
let pedidosAbertos = [];

async function carregarAbertos() {
    const r = await fetch("/pedido");
    pedidosAbertos = await r.json();
    renderAbertos(pedidosAbertos);
}

function renderAbertos(lista) {
    document.getElementById("tabela-abertos").innerHTML = lista.map(p => `
        <tr>
            <td>${p.id}</td>
            <td>${p.nome_cliente}</td>
            <td>R$ ${Number(p.valor_total).toFixed(2)}</td>
            <td>${p.data_pedido}</td>
            <td>
                <button class="btn-fin" onclick="finalizar(${p.id})">Finalizar</button>
                <button class="btn-del" onclick="excluir(${p.id})">Excluir</button>
            </td>
        </tr>
    `).join("");
}

function buscarAbertos() {
    const t = buscaAbertos.value.toLowerCase();
    renderAbertos(pedidosAbertos.filter(p =>
        p.nome_cliente.toLowerCase().includes(t)
    ));
}

async function finalizar(id) {
    await fetch(`/finalizar_pedido/${id}`, { method: "PUT" });
    carregarAbertos();
}

async function excluir(id) {
    await fetch(`/pedido/${id}`, { method: "DELETE" });
    carregarAbertos();
}

/* ---------- FINALIZADOS ---------- */
let pedidosFinalizados = [];

async function carregarFinalizados() {
    const r = await fetch("/pedidos_finalizados");
    pedidosFinalizados = await r.json();
    renderFinalizados(pedidosFinalizados);
}

function renderFinalizados(lista) {
    document.getElementById("tabela-finalizados").innerHTML = lista.map(p => `
        <tr>
            <td>${p.id}</td>
            <td>${p.nome_cliente}</td>
            <td>R$ ${Number(p.valor_total).toFixed(2)}</td>
            <td>${p.data_pedido}</td>
        </tr>
    `).join("");
}

function imprimir() {
    const c = document.getElementById("tabela-impressao").outerHTML;
    const w = window.open("", "", "width=900,height=600");
    w.document.write(`<html><body>${c}</body></html>`);
    w.print();
    w.close();
}

function limparFinalizados() {
    fetch("/pedido/limpar", { method: "DELETE" })
        .then(() => carregarFinalizados());
}

/* ---------- PRODUTOS CLIENTE ---------- */
let produtosCliente = [];

async function carregarClientes() {
    const r = await fetch("/produto_cliente");
    produtosCliente = await r.json();
    renderClientes(produtosCliente);
}

function renderClientes(lista) {
    document.getElementById("tabela-clientes").innerHTML = lista.map(p => `
        <tr>
            <td>${p.id}</td>
            <td>${p.cliente}</td>
            <td>${p.produto}</td>
        </tr>
    `).join("");
}

function buscarClientes() {
    const t = buscaCliente.value.toLowerCase();
    renderClientes(produtosCliente.filter(p =>
        p.cliente.toLowerCase().includes(t) ||
        p.produto.toLowerCase().includes(t)
    ));
}

async function deletarProdutosCliente() {
    if (!confirm("Deseja apagar TODOS os produtos do cliente?")) return;

    await fetch("/produto_cliente", { method: "DELETE" });
    carregarClientes();
}

/* INIT */
carregarAbertos();
</script>

</body>
</html>
