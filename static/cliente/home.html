<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Home - Pedido</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-4">

    <h2 class="mb-4">🛒 Novo Pedido</h2>

    <!-- Nome do cliente -->
    <div class="mb-3">
        <label class="form-label">Nome do Cliente</label>
        <input
            type="text"
            id="nomeCliente"
            class="form-control"
            placeholder="Digite o nome">
    </div>

    <!-- Produtos do dia -->
    <h4 class="mt-4">Produtos do Dia</h4>

    <table class="table table-bordered mt-2">
        <thead class="table-light">
            <tr>
                <th>Produto</th>
                <th>Preço</th>
                <th>Estoque</th>
                <th class="text-center">Quantidade</th>
            </tr>
        </thead>
        <tbody id="listaProdutos"></tbody>
    </table>

    <!-- Itens do pedido -->
    <h4 class="mt-4">Itens do Pedido</h4>
    <table class="table table-sm">
        <thead>
            <tr>
                <th>Produto</th>
                <th>Qtd</th>
            </tr>
        </thead>
        <tbody id="itensPedido"></tbody>
    </table>

    <button class="btn btn-primary mt-3" onclick="criarPedido()">
        Criar Pedido
    </button>

</div>

<script>
const BASE_URL = "http://127.0.0.1:5000";

let produtosDia = [];
let produtosSelecionados = [];

// Função para verificar se o produto é Coxa/Sobrecoxa
function isCoxaSobrecoxa(nome) {
    return nome && nome.toLowerCase().includes('coxa') && nome.toLowerCase().includes('sobrecoxa');
}

// Função para obter o incremento baseado no produto
function getIncremento(nome) {
    return isCoxaSobrecoxa(nome) ? 0.25 : 1;
}

/* ===============================
   PRODUTOS DO DIA
================================ */
async function carregarProdutosDia() {
    const resp = await fetch(`${BASE_URL}/produto_dia`);
    produtosDia = await resp.json();

    const tbody = document.getElementById("listaProdutos");
    tbody.innerHTML = "";

    produtosDia.forEach(p => {
        const item = produtosSelecionados.find(i => i.produto_id === p.id);
        const qtdSelecionada = item ? item.quantidade : 0;
        const incremento = getIncremento(p.nome);

        // Verifica se pode incrementar (considerando estoque e incremento específico)
        const podeIncrementar = (qtdSelecionada + incremento) <= p.qtd;
        const disabledMais = !podeIncrementar ? "disabled" : "";

        // Formata a exibição da quantidade com 2 casas decimais para todos
        const qtdDisplay = qtdSelecionada.toFixed(2);

        tbody.innerHTML += `
            <tr>
                <td>${p.nome}</td>
                <td>R$ ${p.preco.toFixed(2)}</td>
                <td>${p.qtd}</td>
                <td class="text-center">
                    <button class="btn btn-outline-danger btn-sm"
                        onclick="alterarQuantidade(${p.id}, '${p.nome}', ${-incremento})">
                        −
                    </button>

                    <span class="mx-2 fw-bold">${qtdDisplay}</span>

                    <button class="btn btn-outline-success btn-sm"
                        ${disabledMais}
                        onclick="alterarQuantidade(${p.id}, '${p.nome}', ${incremento})">
                        +
                    </button>
                </td>
            </tr>
        `;
    });
}

/* ===============================
   ALTERAR QUANTIDADE
================================ */
function alterarQuantidade(id, nome, delta) {
    const produto = produtosDia.find(p => p.id === id);
    let item = produtosSelecionados.find(p => p.produto_id === id);

    if (!item && delta > 0) {
        produtosSelecionados.push({
            produto_id: id,
            nome,
            quantidade: Math.abs(delta)
        });
    } else if (item) {
        // Calcula nova quantidade
        let novaQuantidade = item.quantidade + delta;

        // Arredonda para evitar problemas de ponto flutuante (sempre 2 casas decimais)
        novaQuantidade = Math.round(novaQuantidade * 100) / 100;

        // Verifica limites
        if (novaQuantidade > produto.qtd) {
            novaQuantidade = produto.qtd;
        }

        if (novaQuantidade <= 0) {
            produtosSelecionados = produtosSelecionados.filter(
                p => p.produto_id !== id
            );
        } else {
            item.quantidade = novaQuantidade;
        }
    }

    renderizarItens();
    carregarProdutosDia();
}

/* ===============================
   RENDERIZAR ITENS
================================ */
function renderizarItens() {
    const tbody = document.getElementById("itensPedido");
    tbody.innerHTML = "";

    produtosSelecionados.forEach(p => {
        // Formata a exibição da quantidade com 2 casas decimais para todos
        const qtdDisplay = p.quantidade.toFixed(2);

        tbody.innerHTML += `
            <tr>
                <td>${p.nome}</td>
                <td>${qtdDisplay}</td>
            </tr>
        `;
    });
}

/* ===============================
   CRIAR PEDIDO
================================ */
async function criarPedido() {
    const cliente = document
        .getElementById("nomeCliente")
        .value
        .trim()
        .toUpperCase();

    if (!cliente) {
        alert("Nome obrigatório");
        return;
    }

    if (produtosSelecionados.length === 0) {
        alert("Selecione produtos");
        return;
    }

    // Validação: verificar se todas as quantidades são números válidos
    for (const item of produtosSelecionados) {
        // Garantir que a quantidade seja um número com no máximo 2 casas decimais
        item.quantidade = Math.round(item.quantidade * 100) / 100;

        if (item.quantidade <= 0) {
            alert(`Quantidade inválida para o produto ${item.nome}`);
            return;
        }
    }

    /* 1️⃣ Produtos do cliente */
    for (const item of produtosSelecionados) {
        const response = await fetch(`${BASE_URL}/produtos_cliente`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                cliente: cliente,
                produto: item.nome,
                qtd: item.quantidade
            })
        });

        if (!response.ok) {
            const errorData = await response.json();
            alert(errorData.erro || `Erro ao adicionar produto ${item.nome}`);
            return;
        }
    }

    /* 2️⃣ Cria pedido */
    const payload = {
        nome_cliente: cliente,
        produtos: produtosSelecionados.map(p => ({
            produto_id: p.produto_id,
            quantidade: p.quantidade
        }))
    };

    try {
        const resp = await fetch(`${BASE_URL}/pedido`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });

        const data = await resp.json();

        if (!resp.ok) {
            alert(data.erro || "Erro ao criar pedido");
            return;
        }

        alert("✅ Pedido criado com sucesso!");

        /* Reset */
        produtosSelecionados = [];
        document.getElementById("nomeCliente").value = "";
        renderizarItens();
        carregarProdutosDia();

    } catch (error) {
        alert("Erro de conexão com o servidor");
        console.error(error);
    }
}

/* INIT */
carregarProdutosDia();
</script>

</body>
</html>
