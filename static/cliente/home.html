<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Home - Novo Pedido</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .table th { background-color: #e9ecef; }
        .coxa-sobrecoxa-badge {
            background-color: #ffc107;
            color: #000;
            font-size: 0.8rem;
            padding: 3px 8px;
            border-radius: 12px;
            margin-left: 5px;
        }
        .console-log {
            background-color: #1e1e1e;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            padding: 10px;
            border-radius: 5px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 12px;
            margin-top: 20px;
        }
        .log-info { color: #00ff00; }
        .log-warning { color: #ffaa00; }
        .log-error { color: #ff5555; }
        .log-debug { color: #8888ff; }
    </style>
</head>
<body class="bg-light">

<div class="container mt-4">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h2 class="mb-0">🛒 Novo Pedido</h2>
        </div>
        <div class="card-body">

            <!-- Nome do cliente -->
            <div class="mb-3">
                <label class="form-label fw-bold">Nome do Cliente</label>
                <input type="text" id="nomeCliente" class="form-control" placeholder="Digite o nome">
            </div>

            <!-- Botões de log -->
            <div class="mb-2">
                <button class="btn btn-sm btn-secondary" type="button" onclick="toggleLogs()">
                    🖥️ Mostrar Logs
                </button>
                <button class="btn btn-sm btn-warning" type="button" onclick="limparLogs()">
                    🧹 Limpar Logs
                </button>
            </div>

            <!-- Console de logs -->
            <div id="consoleLogs" class="console-log mb-3" style="display: none;">
                <div id="logMessages"></div>
            </div>

            <!-- Produtos do dia -->
            <h4 class="mt-4">📦 Produtos do Dia</h4>
            <div class="table-responsive">
                <table class="table table-bordered table-hover">
                    <thead class="table-light">
                        <tr>
                            <th>Produto</th>
                            <th>Preço</th>
                            <th>Estoque</th>
                            <th class="text-center">Quantidade</th>
                        </tr>
                    </thead>
                    <tbody id="listaProdutos"></tbody>
                </table>
            </div>

            <!-- Itens do pedido -->
            <h4 class="mt-4">🛍️ Itens do Pedido</h4>
            <div class="table-responsive">
                <table class="table table-sm table-striped">
                    <thead>
                        <tr>
                            <th>Produto</th>
                            <th>Quantidade</th>
                            <th>Preço</th>
                        </tr>
                    </thead>
                    <tbody id="itensPedido"></tbody>
                </table>
            </div>

            <div class="row mt-3">
                <div class="col-md-8">
                    <h4 id="valorTotalDisplay" class="text-end text-primary">Total: R$ 0.00</h4>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-primary btn-lg w-100" onclick="criarPedido()">
                        ✅ Criar Pedido
                    </button>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
const BASE_URL = "https://vendas-svoq.onrender.com";

let produtosDia = [];
let produtosSelecionados = [];
let logsVisiveis = false;

// ===== FUNÇÕES DE LOG =====
function addLog(mensagem, tipo = 'info') {
    const logDiv = document.getElementById('logMessages');
    const timestamp = new Date().toLocaleTimeString('pt-BR', { hour12: false });
    let cor = '#00ff00';
    if (tipo === 'error') cor = '#ff5555';
    if (tipo === 'warning') cor = '#ffaa00';
    if (tipo === 'debug') cor = '#8888ff';

    logDiv.innerHTML += `<div style="color: ${cor}">[${timestamp}] ${mensagem}</div>`;
    const consoleDiv = document.getElementById('consoleLogs');
    consoleDiv.scrollTop = consoleDiv.scrollHeight;
    console.log(`[${timestamp}] ${mensagem}`);
}

function toggleLogs() {
    logsVisiveis = !logsVisiveis;
    document.getElementById('consoleLogs').style.display = logsVisiveis ? 'block' : 'none';
    if (logsVisiveis) addLog('🔍 Logs ativados', 'info');
}

function limparLogs() {
    document.getElementById('logMessages').innerHTML = '';
    addLog('🧹 Logs limpos', 'info');
}

// ===== FUNÇÕES DE CATEGORIZAÇÃO =====
function isCategoria1(nome) {
    const produtos = ['pernil', 'costelinha', 'panceta', 'lombo', 'copa lombo', 'joelho'];
    return produtos.some(p => nome.toLowerCase().includes(p));
}

function isCategoria2(nome) {
    return nome && nome.toLowerCase().includes('coxa') && nome.toLowerCase().includes('sobrecoxa');
}

function isCategoria3(nome) {
    return nome && nome.toLowerCase().includes('frango') && nome.toLowerCase().includes('recheado');
}

function isCategoria4(nome) {
    const produtos = ['lasanha', 'maionese', 'salpicão', 'salpicao', 'feijão tropeiro', 'feijao tropeiro'];
    return produtos.some(p => nome.toLowerCase().includes(p));
}

// Função para obter o incremento baseado no produto
function getIncremento(nome) {
    if (isCategoria2(nome)) {
        return 1; // Coxa/Sobrecoxa: pula de 1 em 1 (cada clique = 1 par)
    } else if (isCategoria3(nome)) {
        return 1; // Frango Recheado: pula de 1 em 1
    } else if (isCategoria4(nome)) {
        return 0.5; // Lasanha, Maionese, Salpicão, Feijão: pula de 0.5 em 0.5
    } else {
        return 0.1; // Pernil, Costelinha, etc: incremento pequeno
    }
}

function getQuantidadeReal(nome, quantidade) {
    return quantidade; // O backend já recebe em pares para Coxa/Sobrecoxa
}

// Função para arredondar conforme a categoria
function arredondarQuantidade(valor, nome) {
    if (isCategoria2(nome)) {
        // Coxa/Sobrecoxa: números inteiros (pares)
        return Math.round(valor); // ANTES ERA: Math.round(valor / 2) * 2;
    } else if (isCategoria3(nome)) {
        // Frango Recheado: inteiros
        return Math.round(valor);
    } else if (isCategoria4(nome)) {
        // Lasanha, etc: múltiplos de 0.5
        return Math.round(valor * 2) / 2;
    } else {
        // Demais categorias: 3 casas decimais
        return Math.round(valor * 1000) / 1000;
    }
}

// Função para formatar a exibição da quantidade
function formatarQuantidade(valor, nome) {
    if (isCategoria2(nome)) {
        return valor.toFixed(0); // Coxa/Sobrecoxa mostra inteiro (pares)
    } else if (isCategoria3(nome)) {
        return valor.toFixed(0); // Frango Recheado mostra inteiro
    } else if (isCategoria4(nome)) {
        return valor.toFixed(1); // Lasanha, etc mostra 1 casa
    } else {
        return valor.toFixed(3); // Demais mostra 3 casas
    }
}

// ===== FUNÇÕES DE CÁLCULO =====
function calcularPrecoCoxaSobrecoxa(pares) {
    if (pares <= 0) return 0;

    if (pares === 1) return 10.00;
    else if (pares === 2) return 20.00;
    else if (pares === 3) return 25.00;
    else if (pares === 4) return 35.00;
    else if (pares === 5) return 40.00;
    else if (pares === 6) return 50.00;
    else {
        const paresAdicionais = pares - 6;
        return 50.00 + (paresAdicionais * 10);
    }
}

function calcularSubtotal(item) {
    const produto = produtosDia.find(p => p.id === item.produto_id);
    if (!produto) return 0;

    if (isCategoria2(item.nome)) {
        return calcularPrecoCoxaSobrecoxa(item.quantidade);
    } else {
        return item.quantidade * produto.preco;
    }
}

function calcularValorTotal() {
    let total = 0;
    produtosSelecionados.forEach(item => {
        total += calcularSubtotal(item);
    });
    return total;
}

function atualizarValorTotal() {
    const total = calcularValorTotal();
    document.getElementById('valorTotalDisplay').innerHTML = `Total: R$ ${total.toFixed(2)}`;
}

// ===== FUNÇÃO DE INPUT =====
function atualizarQuantidadeInput(id, nome) {
    const input = document.getElementById(`input-qtd-${id}`);
    if (!input) return;

    let valor = parseFloat(input.value);
    if (isNaN(valor) || valor < 0) valor = 0;

    const produto = produtosDia.find(p => p.id === id);
    if (!produto) return;

    valor = arredondarQuantidade(valor, nome);

    if (valor > produto.qtd) {
        valor = produto.qtd;
        input.value = formatarQuantidade(valor, nome);
    }

    let item = produtosSelecionados.find(p => p.produto_id === id);

    if (valor <= 0) {
        produtosSelecionados = produtosSelecionados.filter(p => p.produto_id !== id);
    } else {
        if (!item) {
            produtosSelecionados.push({ produto_id: id, nome, quantidade: valor });
        } else {
            item.quantidade = valor;
        }
    }

    renderizarItens();
    carregarProdutosDia();
    atualizarValorTotal();
}

// ===== CARREGAR PRODUTOS =====
async function carregarProdutosDia() {
    try {
        const resp = await fetch(`${BASE_URL}/produto_dia`);
        produtosDia = await resp.json();
        addLog(`✅ Produtos carregados: ${produtosDia.length} itens`, 'info');

        const tbody = document.getElementById("listaProdutos");
        tbody.innerHTML = "";

        produtosDia.forEach(p => {
            const item = produtosSelecionados.find(i => i.produto_id === p.id);
            let qtdSelecionada = item ? item.quantidade : 0;
            const incremento = getIncremento(p.nome);
            const temInputLivre = isCategoria1(p.nome) || isCategoria4(p.nome);

            if (item) {
                qtdSelecionada = arredondarQuantidade(qtdSelecionada, p.nome);
                item.quantidade = qtdSelecionada;
            }

            const podeIncrementar = (qtdSelecionada + incremento) <= p.qtd;
            const podeDecrementar = qtdSelecionada > 0;
            const qtdDisplay = formatarQuantidade(qtdSelecionada, p.nome);

            if (temInputLivre) {
                tbody.innerHTML += `
                    <tr>
                        <td>${p.nome} ${isCategoria2(p.nome) ? '<span class="coxa-sobrecoxa-badge">Coxa/Sobrecoxa</span>' : ''}</td>
                        <td>R$ ${p.preco.toFixed(2)}</td>
                        <td>${p.qtd}</td>
                        <td class="text-center">
                            <div class="d-flex align-items-center justify-content-center">
                                <button class="btn btn-outline-danger btn-sm me-1"
                                    ${!podeDecrementar ? 'disabled' : ''}
                                    onclick="alterarQuantidade(${p.id}, '${p.nome}', ${-incremento})">−</button>
                                <input type="number" id="input-qtd-${p.id}"
                                    class="form-control form-control-sm text-center mx-1"
                                    style="width: 100px;" step="0.001" min="0" max="${p.qtd}"
                                    value="${qtdSelecionada}"
                                    onchange="atualizarQuantidadeInput(${p.id}, '${p.nome}')">
                                <button class="btn btn-outline-success btn-sm ms-1"
                                    ${!podeIncrementar ? 'disabled' : ''}
                                    onclick="alterarQuantidade(${p.id}, '${p.nome}', ${incremento})">+</button>
                            </div>
                        </td>
                    </tr>
                `;
            } else {
                tbody.innerHTML += `
                    <tr>
                        <td>${p.nome} ${isCategoria2(p.nome) ? '<span class="coxa-sobrecoxa-badge">Coxa/Sobrecoxa</span>' : ''}</td>
                        <td>R$ ${p.preco.toFixed(2)}</td>
                        <td>${p.qtd}</td>
                        <td class="text-center">
                            <button class="btn btn-outline-danger btn-sm"
                                ${!podeDecrementar ? 'disabled' : ''}
                                onclick="alterarQuantidade(${p.id}, '${p.nome}', ${-incremento})">−</button>
                            <span class="mx-2 fw-bold">${qtdDisplay}</span>
                            <button class="btn btn-outline-success btn-sm"
                                ${!podeIncrementar ? 'disabled' : ''}
                                onclick="alterarQuantidade(${p.id}, '${p.nome}', ${incremento})">+</button>
                        </td>
                    </tr>
                `;
            }
        });

        atualizarValorTotal();
    } catch (error) {
        addLog(`❌ Erro ao carregar produtos: ${error.message}`, 'error');
    }
}

// ===== ALTERAR QUANTIDADE =====
function alterarQuantidade(id, nome, delta) {
    const produto = produtosDia.find(p => p.id === id);
    let item = produtosSelecionados.find(p => p.produto_id === id);

    if (!item && delta > 0) {
        let quantidadeInicial = Math.abs(delta);
        quantidadeInicial = arredondarQuantidade(quantidadeInicial, nome);
        produtosSelecionados.push({ produto_id: id, nome, quantidade: quantidadeInicial });
    } else if (item) {
        let novaQuantidade = item.quantidade + delta;
        novaQuantidade = arredondarQuantidade(novaQuantidade, nome);

        if (novaQuantidade > produto.qtd) {
            novaQuantidade = produto.qtd;
        }

        if (novaQuantidade <= 0) {
            produtosSelecionados = produtosSelecionados.filter(p => p.produto_id !== id);
        } else {
            item.quantidade = novaQuantidade;
        }
    }

    renderizarItens();
    carregarProdutosDia();
    atualizarValorTotal();
}

// ===== RENDERIZAR ITENS =====
function renderizarItens() {
    const tbody = document.getElementById("itensPedido");
    tbody.innerHTML = "";

    produtosSelecionados.forEach(p => {
        const qtdDisplay = formatarQuantidade(p.quantidade, p.nome);
        const subtotal = calcularSubtotal(p);

        tbody.innerHTML += `
            <tr>
                <td>${p.nome}</td>
                <td>${qtdDisplay}</td>
                <td>R$ ${subtotal.toFixed(2)}</td>
            </tr>
        `;
    });
}

// ===== CRIAR PEDIDO =====
async function criarPedido() {
    const cliente = document.getElementById("nomeCliente").value.trim().toUpperCase();

    if (!cliente) {
        alert("Nome obrigatório");
        return;
    }

    if (produtosSelecionados.length === 0) {
        alert("Selecione produtos");
        return;
    }

    for (const item of produtosSelecionados) {
        item.quantidade = arredondarQuantidade(item.quantidade, item.nome);
        if (item.quantidade <= 0) {
            alert(`Quantidade inválida para ${item.nome}`);
            return;
        }
    }

    const valorTotalCalculado = calcularValorTotal();

    try {
        const payload = {
            nome_cliente: cliente,
            produtos: produtosSelecionados.map(p => ({
                produto_id: p.produto_id,
                quantidade: p.quantidade
            }))
        };

        addLog(`📤 Enviando pedido: ${JSON.stringify(payload)}`, 'debug');

        const resp = await fetch(`${BASE_URL}/pedido`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });

        const data = await resp.json();

        if (!resp.ok) {
            alert(data.erro || "Erro ao criar pedido");
            return;
        }

        alert(`✅ Pedido criado! ID: ${data.pedido_id} - Total: R$ ${data.valor_total.toFixed(2)}`);

        produtosSelecionados = [];
        document.getElementById("nomeCliente").value = "";
        renderizarItens();
        carregarProdutosDia();
        atualizarValorTotal();

    } catch (error) {
        alert("Erro de conexão");
        console.error(error);
    }
}

// ===== INICIALIZAÇÃO =====
carregarProdutosDia();
</script>

</body>
</html>
