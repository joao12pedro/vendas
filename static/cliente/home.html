<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Home - Novo Pedido</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background: linear-gradient(135deg, #f5f7fa 0%, #e9ecef 100%); color: #1e293b; font-family: 'Segoe UI', sans-serif; min-height: 100vh; }
        .container { max-width: 1400px; padding: 1.5rem; }
        .card { border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); background: #fff; border: 1px solid #e2e8f0; }
        .card-header { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: white; border-radius: 20px 20px 0 0; }
        .card-body { padding: 1.5rem; }
        h2 { font-size: 1.5rem; margin: 0; }
        h4 { color: #0f172a; font-weight: 600; margin-top: 1.5rem; margin-bottom: 1rem; }
        .table { color: #1e293b; border-color: #e2e8f0; }
        .table th { background: #f1f5f9; color: #0f172a; font-weight: 600; padding: 12px 8px; }
        .table td { background: #fff; padding: 12px 8px; vertical-align: middle; }
        .table-hover tbody tr:hover td { background-color: #f8fafc; }
        .coxa-badge { background-color: #f59e0b; color: #fff; font-size: 0.7rem; padding: 2px 8px; border-radius: 12px; margin-left: 8px; }
        .frango-badge { background-color: #10b981; color: #fff; font-size: 0.7rem; padding: 2px 8px; border-radius: 12px; margin-left: 8px; }
        .console-log { background: #0f172a; color: #a5f3fc; font-family: monospace; padding: 15px; border-radius: 12px; max-height: 200px; overflow-y: auto; font-size: 12px; margin-bottom: 15px; }
        .btn { border-radius: 10px; font-weight: 500; transition: all 0.2s; }
        .btn-primary { background: #3b82f6; border-color: #3b82f6; }
        .btn-primary:hover { background: #2563eb; transform: translateY(-1px); }
        .btn-outline-danger { border-color: #ef4444; color: #ef4444; }
        .btn-outline-danger:hover { background: #ef4444; color: white; }
        .btn-outline-success { border-color: #22c55e; color: #22c55e; }
        .btn-outline-success:hover { background: #22c55e; color: white; }
        .input-quantidade { width: 100px; text-align: center; margin: 0 5px; }
        .valor-total { font-size: 1.5rem; font-weight: 700; color: #3b82f6; }
        @media (max-width: 768px) { .input-quantidade { width: 70px; } .btn-sm { padding: 4px 8px; } }
    </style>
</head>
<body>

<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h2 class="mb-0">🛒 Novo Pedido</h2>
        </div>
        <div class="card-body">

            <!-- Nome do cliente -->
            <div class="mb-4">
                <label class="form-label fw-bold">Nome do Cliente</label>
                <input type="text" id="nomeCliente" class="form-control" placeholder="Digite o nome" style="max-width: 400px;">
            </div>

            <!-- Botões de log -->
            <div class="mb-2">
                <button class="btn btn-sm btn-secondary" onclick="toggleLogs()">🖥️ Mostrar Logs</button>
                <button class="btn btn-sm btn-warning" onclick="limparLogs()">🧹 Limpar Logs</button>
            </div>

            <div id="consoleLogs" class="console-log" style="display: none;">
                <div id="logMessages"></div>
            </div>

            <!-- Produtos do dia -->
            <h4>📦 Produtos do Dia</h4>
            <div class="table-responsive">
                <table class="table table-bordered table-hover">
                    <thead class="table-light">
                        <tr><th>Produto</th><th>Preço</th><th>Estoque</th><th class="text-center">Quantidade</th></tr>
                    </thead>
                    <tbody id="listaProdutos"></tbody>
                </table>
            </div>

            <!-- Itens do pedido -->
            <h4>🛍️ Itens do Pedido</h4>
            <div class="table-responsive">
                <table class="table table-sm table-striped">
                    <thead><tr><th>Produto</th><th>Quantidade</th><th>Preço</th></tr></thead>
                    <tbody id="itensPedido"></tbody>
                </table>
            </div>

            <div class="row mt-4 align-items-center">
                <div class="col-md-8 text-end">
                    <h3 class="valor-total">Total: R$ <span id="valorTotal">0.00</span></h3>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-primary btn-lg w-100" onclick="criarPedido()">✅ Criar Pedido</button>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
const BASE_URL = "http://127.0.0.1:5000";
let produtosDia = [];
let produtosSelecionados = [];
let logsVisiveis = false;

function addLog(mensagem, tipo = 'info') {
    const logDiv = document.getElementById('logMessages');
    const timestamp = new Date().toLocaleTimeString('pt-BR');
    let cor = '#22c55e';
    if (tipo === 'error') cor = '#ef4444';
    if (tipo === 'warning') cor = '#f59e0b';
    logDiv.innerHTML += `<div style="color: ${cor}">[${timestamp}] ${mensagem}</div>`;
    document.getElementById('consoleLogs').scrollTop = document.getElementById('consoleLogs').scrollHeight;
    console.log(`[${timestamp}] ${mensagem}`);
}

function toggleLogs() { logsVisiveis = !logsVisiveis; document.getElementById('consoleLogs').style.display = logsVisiveis ? 'block' : 'none'; }
function limparLogs() { document.getElementById('logMessages').innerHTML = ''; addLog('🧹 Logs limpos', 'info'); }

// ===== FUNÇÕES DE CATEGORIZAÇÃO =====
function isCoxaSobrecoxa(nome) {
    return nome && nome.toLowerCase().includes('coxa') && nome.toLowerCase().includes('sobrecoxa');
}

function isFrangoRecheado(nome) {
    return nome && nome.toLowerCase().includes('frango') && nome.toLowerCase().includes('recheado');
}

function isOutros(nome) {
    return !isCoxaSobrecoxa(nome) && !isFrangoRecheado(nome);
}

// ===== INCREMENTOS =====
function getIncremento(nome) {
    if (isCoxaSobrecoxa(nome)) return 1;      // Coxa/Sobrecoxa: 1 em 1 (pares)
    if (isFrangoRecheado(nome)) return 1;     // Frango Recheado: 1 em 1
    return 0.5;                               // Demais produtos: 0.5 em 0.5
}

function arredondarQuantidade(valor, nome) {
    if (isCoxaSobrecoxa(nome)) {
        return Math.round(valor);  // Coxa/Sobrecoxa: números inteiros (pares)
    }
    if (isFrangoRecheado(nome)) {
        return Math.round(valor);  // Frango Recheado: números inteiros
    }
    return Math.round(valor * 2) / 2;  // Demais: múltiplos de 0.5
}

function formatarQuantidade(valor, nome) {
    if (isCoxaSobrecoxa(nome)) {
        return valor.toFixed(0) + ' par(es)';
    }
    if (isFrangoRecheado(nome)) {
        return valor.toFixed(0);
    }
    return valor.toFixed(2);
}

// ===== CÁLCULO DE PREÇO =====
function calcularPrecoCoxaSobrecoxa(pares) {
    if (pares <= 0) return 0;
    if (pares === 1) return 10;
    if (pares === 2) return 20;
    if (pares === 3) return 25;
    if (pares === 4) return 35;
    if (pares === 5) return 40;
    if (pares === 6) return 50;
    return 50 + ((pares - 6) * 10);
}

function getQuantidadeReal(nome, quantidade) {
    return quantidade; // A quantidade já está correta (pares para Coxa)
}

function calcularSubtotal(item) {
    const produto = produtosDia.find(p => p.id === item.produto_id);
    if (!produto) return 0;

    if (isCoxaSobrecoxa(item.nome)) {
        return calcularPrecoCoxaSobrecoxa(item.quantidade);
    }
    return item.quantidade * produto.preco;
}

function calcularValorTotal() {
    let total = 0;
    produtosSelecionados.forEach(item => {
        total += calcularSubtotal(item);
    });
    return total;
}

function atualizarValorTotal() {
    const total = calcularValorTotal();
    document.getElementById('valorTotal').innerText = total.toFixed(2);
}

// ===== ATUALIZAR QUANTIDADE =====
function atualizarQuantidadeInput(id, nome) {
    const input = document.getElementById(`input-qtd-${id}`);
    if (!input) return;

    let valor = parseFloat(input.value);
    if (isNaN(valor) || valor < 0) valor = 0;

    const produto = produtosDia.find(p => p.id === id);
    if (!produto) return;

    valor = arredondarQuantidade(valor, nome);

    if (valor > produto.qtd) {
        valor = produto.qtd;
        input.value = formatarQuantidade(valor, nome);
    }

    let item = produtosSelecionados.find(p => p.produto_id === id);

    if (valor <= 0) {
        produtosSelecionados = produtosSelecionados.filter(p => p.produto_id !== id);
    } else {
        if (!item) {
            produtosSelecionados.push({ produto_id: id, nome, quantidade: valor });
        } else {
            item.quantidade = valor;
        }
    }

    renderizarItens();
    carregarProdutosDia();
    atualizarValorTotal();
}

function alterarQuantidade(id, nome, delta) {
    const produto = produtosDia.find(p => p.id === id);
    let item = produtosSelecionados.find(p => p.produto_id === id);

    if (!item && delta > 0) {
        let quantidadeInicial = Math.abs(delta);
        quantidadeInicial = arredondarQuantidade(quantidadeInicial, nome);
        produtosSelecionados.push({ produto_id: id, nome, quantidade: quantidadeInicial });
    } else if (item) {
        let novaQuantidade = item.quantidade + delta;
        novaQuantidade = arredondarQuantidade(novaQuantidade, nome);

        if (novaQuantidade > produto.qtd) {
            novaQuantidade = produto.qtd;
        }

        if (novaQuantidade <= 0) {
            produtosSelecionados = produtosSelecionados.filter(p => p.produto_id !== id);
        } else {
            item.quantidade = novaQuantidade;
        }
    }

    renderizarItens();
    carregarProdutosDia();
    atualizarValorTotal();
}

// ===== RENDERIZAR PRODUTOS =====
async function carregarProdutosDia() {
    try {
        const resp = await fetch(`${BASE_URL}/produto_dia`);
        produtosDia = await resp.json();
        addLog(`✅ Produtos carregados: ${produtosDia.length} itens`);
        renderizarProdutos();
    } catch (error) {
        addLog(`❌ Erro ao carregar produtos: ${error.message}`, 'error');
    }
}

function renderizarProdutos() {
    const tbody = document.getElementById("listaProdutos");
    tbody.innerHTML = "";

    produtosDia.forEach(p => {
        const item = produtosSelecionados.find(i => i.produto_id === p.id);
        let qtd = item ? item.quantidade : 0;
        const incremento = getIncremento(p.nome);
        const podeInc = (qtd + incremento) <= p.qtd;
        const podeDec = qtd > 0;
        const qtdDisplay = formatarQuantidade(qtd, p.nome);

        let badge = '';
        if (isCoxaSobrecoxa(p.nome)) badge = '<span class="coxa-badge">Coxa/Sobrecoxa (promoção)</span>';
        if (isFrangoRecheado(p.nome)) badge = '<span class="frango-badge">Frango Recheado</span>';

        // Para produtos que não são Coxa nem Frango Recheado, usa input com step 0.5
        const usaInput = isOutros(p.nome);

        if (usaInput) {
            tbody.innerHTML += `
                <tr>
                    <td>${p.nome} ${badge}<\/td>
                    <td>R$ ${p.preco.toFixed(2)}<\/td>
                    <td>${p.qtd}<\/td>
                    <td class="text-center">
                        <div class="d-flex align-items-center justify-content-center">
                            <button class="btn btn-outline-danger btn-sm" ${!podeDec ? 'disabled' : ''} onclick="alterarQuantidade(${p.id}, '${p.nome}', ${-incremento})">−<\/button>
                            <input type="number" id="input-qtd-${p.id}" class="form-control form-control-sm input-quantidade"
                                   value="${qtd}" step="0.5" min="0" max="${p.qtd}"
                                   onchange="atualizarQuantidadeInput(${p.id}, '${p.nome}')">
                            <button class="btn btn-outline-success btn-sm" ${!podeInc ? 'disabled' : ''} onclick="alterarQuantidade(${p.id}, '${p.nome}', ${incremento})">+<\/button>
                        <\/div>
                    <\/td>
                <\/tr>
            `;
        } else {
            tbody.innerHTML += `
                <tr>
                    <td>${p.nome} ${badge}<\/td>
                    <td>R$ ${p.preco.toFixed(2)}<\/td>
                    <td>${p.qtd}<\/td>
                    <td class="text-center">
                        <button class="btn btn-outline-danger btn-sm" ${!podeDec ? 'disabled' : ''} onclick="alterarQuantidade(${p.id}, '${p.nome}', ${-incremento})">−<\/button>
                        <span class="mx-2 fw-bold">${qtdDisplay}</span>
                        <button class="btn btn-outline-success btn-sm" ${!podeInc ? 'disabled' : ''} onclick="alterarQuantidade(${p.id}, '${p.nome}', ${incremento})">+<\/button>
                    <\/td>
                <\/tr>
            `;
        }
    });
    atualizarValorTotal();
}

function renderizarItens() {
    const tbody = document.getElementById("itensPedido");
    tbody.innerHTML = "";

    if (produtosSelecionados.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" class="text-center text-muted">Nenhum item selecionado<\/td></tr>';
        return;
    }

    produtosSelecionados.forEach(p => {
        const qtdDisplay = formatarQuantidade(p.quantidade, p.nome);
        const subtotal = calcularSubtotal(p);
        tbody.innerHTML += `<tr><td>${p.nome}<\/td><td>${qtdDisplay}<\/td><td>R$ ${subtotal.toFixed(2)}<\/td><\/tr>`;
    });
}

// ===== CRIAR PEDIDO =====
async function criarPedido() {
    const cliente = document.getElementById("nomeCliente").value.trim().toUpperCase();
    if (!cliente) { alert("Nome obrigatório"); return; }
    if (produtosSelecionados.length === 0) { alert("Selecione produtos"); return; }

    for (const item of produtosSelecionados) {
        item.quantidade = arredondarQuantidade(item.quantidade, item.nome);
        if (item.quantidade <= 0) { alert(`Quantidade inválida para ${item.nome}`); return; }
    }

    try {
        const payload = {
            nome_cliente: cliente,
            produtos: produtosSelecionados.map(p => ({
                produto_id: p.produto_id,
                quantidade: p.quantidade
            }))
        };
        addLog(`📤 Enviando pedido: ${JSON.stringify(payload)}`, 'debug');

        const resp = await fetch(`${BASE_URL}/pedido`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
        });
        const data = await resp.json();
        if (!resp.ok) throw new Error(data.erro || "Erro ao criar pedido");

        alert(`✅ Pedido criado! ID: ${data.pedido_id} - Total: R$ ${data.valor_total.toFixed(2)}`);
        produtosSelecionados = [];
        document.getElementById("nomeCliente").value = "";
        renderizarItens();
        carregarProdutosDia();
    } catch (error) {
        alert("Erro de conexão");
        console.error(error);
    }
}

carregarProdutosDia();
</script>
</body>
</html>
