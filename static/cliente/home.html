<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Home — Novo Pedido</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 30px;
    }

    .card {
      max-width: 700px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h1 {
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      font-size: 16px;
    }

    button {
      padding: 10px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #1976d2;
      color: #fff;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }

    th {
      background: #f1f1f1;
    }

    .msg {
      margin-top: 10px;
      font-weight: bold;
    }

    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>

<div class="card">
  <h1>Criar Pedido</h1>

  <!-- Nome do cliente -->
  <input id="nomeCliente" type="text" placeholder="Nome do cliente">
  <button id="btnCriarPedido">Criar Pedido</button>

  <div id="mensagem" class="msg"></div>

  <hr>

  <h2>Produtos do Dia</h2>

  <table>
    <thead>
      <tr>
        <th>Produto</th>
        <th>Preço</th>
        <th>Ação</th>
      </tr>
    </thead>
    <tbody id="tabelaProdutos">
      <tr>
        <td colspan="3">Carregando produtos...</td>
      </tr>
    </tbody>
  </table>
</div>

<script>
let pedidoId = null;
let nomeClienteAtual = null;

const msgEl = document.getElementById("mensagem");
const tabelaProdutos = document.getElementById("tabelaProdutos");

/* ------------------ Mensagem ------------------ */
function mostrarMensagem(texto, tipo="") {
  msgEl.textContent = texto;
  msgEl.className = "msg " + tipo;
}

/* ------------------ Criar Pedido ------------------ */
document.getElementById("btnCriarPedido").addEventListener("click", async () => {
  const nome = document.getElementById("nomeCliente").value.trim();

  if (!nome) {
    mostrarMensagem("Digite o nome do cliente", "error");
    return;
  }

  try {
    const res = await fetch("/pedido", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ nome_cliente: nome })
    });

    const data = await res.json();

    if (!res.ok) {
      mostrarMensagem(data.erro || "Erro ao criar pedido", "error");
      return;
    }

    pedidoId = data.dados.id;
    nomeClienteAtual = nome;

    mostrarMensagem(`Pedido criado para ${nome}`, "success");

  } catch (e) {
    console.error(e);
    mostrarMensagem("Erro de conexão com o servidor", "error");
  }
});

/* ------------------ Carregar Produtos do Dia ------------------ */
async function carregarProdutosDia() {
  try {
    const res = await fetch("/produtos_dia");
    const produtos = await res.json();

    if (!Array.isArray(produtos) || produtos.length === 0) {
      tabelaProdutos.innerHTML = "<tr><td colspan='3'>Nenhum produto do dia</td></tr>";
      return;
    }

    tabelaProdutos.innerHTML = produtos.map(p => `
      <tr>
        <td>${p.nome}</td>
        <td>R$ ${Number(p.preco).toFixed(2)}</td>
        <td>
          <button onclick="adicionarProduto('${p.nome}')">Adicionar</button>
        </td>
      </tr>
    `).join("");

  } catch (e) {
    console.error(e);
    tabelaProdutos.innerHTML = "<tr><td colspan='3'>Erro ao carregar produtos</td></tr>";
  }
}

/* ------------------ Adicionar Produto ------------------ */
async function adicionarProduto(nomeProduto) {
  if (!pedidoId || !nomeClienteAtual) {
    alert("Crie o pedido primeiro");
    return;
  }

  try {
    /* 1️⃣ Adiciona item ao pedido */
    const resItem = await fetch("/adicionar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        pedido_id: pedidoId,
        nome_produto: nomeProduto,
        quantidade: 1
      })
    });

    const itemData = await resItem.json();
    if (!resItem.ok) {
      alert(itemData.erro || "Erro ao adicionar item");
      return;
    }

    /* 2️⃣ Registra cliente + produto */
    const resPC = await fetch("/produto_cliente", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        cliente: nomeClienteAtual,
        produto: nomeProduto
      })
    });

    if (!resPC.ok) {
      console.warn("Erro ao salvar produto_cliente");
    }

    mostrarMensagem(`Produto "${nomeProduto}" adicionado`, "success");

  } catch (e) {
    console.error(e);
    mostrarMensagem("Erro ao adicionar produto", "error");
  }
}

/* Inicial */
carregarProdutosDia();
</script>

</body>
</html>
