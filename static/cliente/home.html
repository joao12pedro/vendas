<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Criar Pedido</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  padding: 30px;
}

.card {
  max-width: 850px;
  margin: auto;
  background: #fff;
  padding: 20px;
  border-radius: 8px;
}

input {
  padding: 8px;
  width: 60%;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
}

th, td {
  padding: 10px;
  border-bottom: 1px solid #ddd;
  text-align: center;
}

th {
  background: #eee;
}

button {
  padding: 6px 12px;
  border: none;
  border-radius: 5px;
  background: #1976d2;
  color: #fff;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
</style>
</head>

<body>

<div class="card">
  <h1>Criar Pedido</h1>

  <input id="nomeCliente" placeholder="Nome do cliente">
  <button onclick="criarPedido()">Criar Pedido</button>

  <p id="msg"></p>

  <h2>Produtos do Dia</h2>

  <table>
    <thead>
      <tr>
        <th>Produto</th>
        <th>Preço</th>
        <th>Disponível</th>
        <th>Ação</th>
      </tr>
    </thead>
    <tbody id="tabelaProdutos">
      <tr>
        <td colspan="4">Carregando...</td>
      </tr>
    </tbody>
  </table>
</div>

<script>
let pedidoId = null;
let valorTotal = 0;

/* ================= UTIL ================= */
function normalizarNome(nome) {
  return nome.trim().replace(/\s+/g, " ").toUpperCase();
}

/* ================= CRIAR PEDIDO ================= */
async function criarPedido() {
  const nome = normalizarNome(
    document.getElementById("nomeCliente").value
  );

  if (!nome) {
    alert("Digite o nome do cliente");
    return;
  }

  const res = await fetch("/pedido", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ nome_cliente: nome })
  });

  const data = await res.json();

  if (!res.ok) {
    alert(data.erro);
    return;
  }

  pedidoId = data.dados.id;
  valorTotal = data.dados.valor_total || 0;

  document.getElementById("msg").innerText =
    `Pedido #${pedidoId} criado para ${nome}`;
}

/* ================= LISTAR PRODUTOS DO DIA ================= */
async function carregarProdutosDia() {
  const res = await fetch("/produtos_dia");
  const produtos = await res.json();

  const tbody = document.getElementById("tabelaProdutos");

  tbody.innerHTML = produtos.map(p => `
    <tr>
      <td>${p.nome}</td>
      <td>R$ ${Number(p.preco).toFixed(2)}</td>
      <td>${p.qtd}</td>
      <td>
        <button
          onclick="adicionarProduto('${p.nome}', ${p.preco})"
          ${p.qtd <= 0 ? "disabled" : ""}
        >
          ${p.qtd <= 0 ? "Esgotado" : "Adicionar"}
        </button>
      </td>
    </tr>
  `).join("");
}

/* ================= ADICIONAR PRODUTO ================= */
async function adicionarProduto(nomeProduto, precoProduto) {
  if (!pedidoId) {
    alert("Crie o pedido primeiro");
    return;
  }

  /* 1️⃣ Registra produto do cliente */
  const resProduto = await fetch("/produto_cliente", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      cliente: document.getElementById("nomeCliente").value,
      produto: nomeProduto
    })
  });

  const dataProduto = await resProduto.json();

  if (!resProduto.ok) {
    alert(dataProduto.erro);
    return;
  }

  /* 2️⃣ Atualiza valor total do pedido */
  valorTotal += Number(precoProduto);

  const resPedido = await fetch(`/pedido/${pedidoId}`, {
    method: "PUT",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      valor_total: valorTotal
    })
  });

  const dataPedido = await resPedido.json();

  if (!resPedido.ok) {
    alert(dataPedido.erro);
    return;
  }

  /* 3️⃣ Baixa estoque automaticamente (backend) */
  document.getElementById("msg").innerText =
    `Produto adicionado | Total: R$ ${valorTotal.toFixed(2)}`;

  carregarProdutosDia();
}

/* INIT */
carregarProdutosDia();
</script>

</body>
</html>
