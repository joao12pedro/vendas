<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Home - Novo Pedido</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        .card { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .table th { background-color: #e9ecef; }
        .coxa-sobrecoxa-badge {
            background-color: #ffc107;
            color: #000;
            font-size: 0.8rem;
            padding: 3px 8px;
            border-radius: 12px;
            margin-left: 5px;
        }
        .console-log {
            background-color: #1e1e1e;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            padding: 10px;
            border-radius: 5px;
            max-height: 200px;
            overflow-y: auto;
            font-size: 11px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container mt-4">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h2 class="mb-0">🛒 Novo Pedido</h2>
        </div>
        <div class="card-body">

            <!-- Nome do cliente -->
            <div class="mb-3">
                <label class="form-label fw-bold">Nome do Cliente</label>
                <input type="text" id="nomeCliente" class="form-control" placeholder="Digite o nome">
            </div>

            <!-- Horário do pedido -->
            <div class="mb-3">
                <label class="form-label fw-bold">⏰ Horário do Pedido</label>
                <input type="time" id="horarioPedido" class="form-control" style="max-width: 200px;">
                <small class="text-muted">Deixe em branco para usar o horário atual</small>
            </div>

            <!-- Botões de log -->
            <div class="mb-2">
                <button class="btn btn-sm btn-secondary" type="button" onclick="toggleLogs()">🖥️ Mostrar Logs</button>
                <button class="btn btn-sm btn-warning" type="button" onclick="limparLogs()">🧹 Limpar Logs</button>
            </div>

            <div id="consoleLogs" class="console-log mb-3" style="display: none;">
                <div id="logMessages"></div>
            </div>

            <!-- Produtos do dia -->
            <h4 class="mt-4">📦 Produtos do Dia</h4>
            <div class="table-responsive">
                <table class="table table-bordered table-hover">
                    <thead class="table-light">
                        <tr><th>Produto</th><th>Preço</th><th>Estoque</th><th class="text-center">Quantidade</th></tr>
                    </thead>
                    <tbody id="listaProdutos"></tbody>
                </table>
            </div>

            <!-- Itens do pedido -->
            <h4 class="mt-4">🛍️ Itens do Pedido</h4>
            <div class="table-responsive">
                <table class="table table-sm table-striped">
                    <thead><tr><th>Produto</th><th>Quantidade</th><th>Preço</th><tr></thead>
                    <tbody id="itensPedido"></tbody>
                </table>
            </div>

            <div class="row mt-3">
                <div class="col-md-8">
                    <h4 id="valorTotalDisplay" class="text-end text-primary">Total: R$ 0.00</h4>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-primary btn-lg w-100" onclick="criarPedido()">✅ Criar Pedido</button>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
const BASE_URL = "http://127.0.0.1:5000";

let produtosDia = [];
let produtosSelecionados = [];
let logsVisiveis = false;

// ===== FUNÇÕES DE LOG =====
function addLog(mensagem, tipo = 'info') {
    const logDiv = document.getElementById('logMessages');
    const timestamp = new Date().toLocaleTimeString('pt-BR', { hour12: false });
    let cor = '#0f0';
    if (tipo === 'error') cor = '#f55';
    if (tipo === 'warning') cor = '#ff0';
    if (tipo === 'debug') cor = '#88f';

    logDiv.innerHTML += `<div style="color: ${cor}">[${timestamp}] ${mensagem}</div>`;
    const consoleDiv = document.getElementById('consoleLogs');
    consoleDiv.scrollTop = consoleDiv.scrollHeight;
    console.log(`[${timestamp}] ${mensagem}`);
}

function toggleLogs() {
    logsVisiveis = !logsVisiveis;
    document.getElementById('consoleLogs').style.display = logsVisiveis ? 'block' : 'none';
    if (logsVisiveis) addLog('🔍 Logs ativados', 'info');
}

function limparLogs() {
    document.getElementById('logMessages').innerHTML = '';
    addLog('🧹 Logs limpos', 'info');
}

// ===== FUNÇÃO PARA OBTER HORÁRIO ATUAL =====
function obterHorarioAtual() {
    const agora = new Date();
    const horas = String(agora.getHours()).padStart(2, '0');
    const minutos = String(agora.getMinutes()).padStart(2, '0');
    const segundos = String(agora.getSeconds()).padStart(2, '0');
    return `${horas}:${minutos}:${segundos}`;
}

// ===== FUNÇÕES DE CATEGORIZAÇÃO =====
function isCategoria1(nome) {
    const produtos = ['pernil', 'costelinha', 'panceta', 'lombo', 'copa lombo', 'joelho'];
    return produtos.some(p => nome.toLowerCase().includes(p));
}

function isCategoria2(nome) {
    return nome && nome.toLowerCase().includes('coxa') && nome.toLowerCase().includes('sobrecoxa');
}

function isCategoria3(nome) {
    return nome && nome.toLowerCase().includes('frango') && nome.toLowerCase().includes('recheado');
}

function isCategoria4(nome) {
    const produtos = ['lasanha', 'maionese', 'salpicão', 'salpicao', 'feijão tropeiro', 'feijao tropeiro'];
    return produtos.some(p => nome.toLowerCase().includes(p));
}

function getIncremento(nome) {
    if (isCategoria2(nome)) return 1;
    else if (isCategoria3(nome)) return 1;
    else if (isCategoria4(nome)) return 0.5;
    else return 0.1;
}

function arredondarQuantidade(valor, nome) {
    if (isCategoria2(nome)) return Math.round(valor);
    else if (isCategoria3(nome)) return Math.round(valor);
    else if (isCategoria4(nome)) return Math.round(valor * 2) / 2;
    else return Math.round(valor * 1000) / 1000;
}

function formatarQuantidade(valor, nome) {
    if (isCategoria2(nome)) return valor.toFixed(0) + ' par(es)';
    else if (isCategoria3(nome)) return valor.toFixed(0);
    else if (isCategoria4(nome)) return valor.toFixed(1);
    else return valor.toFixed(3);
}

function calcularPrecoCoxaSobrecoxa(pares) {
    if (pares <= 0) return 0;
    if (pares === 1) return 10.00;
    else if (pares === 2) return 20.00;
    else if (pares === 3) return 25.00;
    else if (pares === 4) return 35.00;
    else if (pares === 5) return 40.00;
    else if (pares === 6) return 50.00;
    else return 50.00 + ((pares - 6) * 10);
}

function calcularSubtotal(item) {
    const produto = produtosDia.find(p => p.id === item.produto_id);
    if (!produto) return 0;
    if (isCategoria2(item.nome)) {
        return calcularPrecoCoxaSobrecoxa(item.quantidade);
    }
    return item.quantidade * produto.preco;
}

function calcularValorTotal() {
    let total = 0;
    produtosSelecionados.forEach(item => {
        total += calcularSubtotal(item);
    });
    return total;
}

function atualizarValorTotal() {
    const total = calcularValorTotal();
    document.getElementById('valorTotalDisplay').innerHTML = `Total: R$ ${total.toFixed(2)}`;
}

function atualizarQuantidadeInput(id, nome) {
    const input = document.getElementById(`input-qtd-${id}`);
    if (!input) return;
    let valor = parseFloat(input.value);
    if (isNaN(valor) || valor < 0) valor = 0;
    const produto = produtosDia.find(p => p.id === id);
    if (!produto) return;
    valor = arredondarQuantidade(valor, nome);
    if (valor > produto.qtd) valor = produto.qtd;
    let item = produtosSelecionados.find(p => p.produto_id === id);
    if (valor <= 0) {
        produtosSelecionados = produtosSelecionados.filter(p => p.produto_id !== id);
    } else {
        if (!item) produtosSelecionados.push({ produto_id: id, nome, quantidade: valor });
        else item.quantidade = valor;
    }
    renderizarItens();
    renderizarProdutos();
    atualizarValorTotal();
}

async function carregarProdutosDia() {
    try {
        const resp = await fetch(`${BASE_URL}/produto_dia`);
        produtosDia = await resp.json();
        addLog(`✅ Produtos carregados: ${produtosDia.length} itens`, 'info');
        renderizarProdutos();
    } catch (error) {
        addLog(`❌ Erro ao carregar produtos: ${error.message}`, 'error');
    }
}

function renderizarProdutos() {
    const tbody = document.getElementById("listaProdutos");
    tbody.innerHTML = "";
    produtosDia.forEach(p => {
        const item = produtosSelecionados.find(i => i.produto_id === p.id);
        let qtd = item ? item.quantidade : 0;
        const incremento = getIncremento(p.nome);
        const podeInc = (qtd + incremento) <= p.qtd;
        const podeDec = qtd > 0;
        const temInputLivre = isCategoria1(p.nome) || isCategoria4(p.nome);
        if (item) {
            qtd = arredondarQuantidade(qtd, p.nome);
            item.quantidade = qtd;
        }
        if (temInputLivre) {
            tbody.innerHTML += `<tr>
                <td>${p.nome} ${isCategoria2(p.nome) ? '<span class="coxa-sobrecoxa-badge">Coxa/Sobrecoxa</span>' : ''}<\/td>
                <td>R$ ${p.preco.toFixed(2)}<\/td>
                <td>${p.qtd}<\/td>
                <td class="text-center">
                    <div class="d-flex align-items-center justify-content-center">
                        <button class="btn btn-outline-danger btn-sm me-1" ${!podeDec ? 'disabled' : ''} onclick="alterarQuantidade(${p.id}, '${p.nome}', ${-incremento})">−</button>
                        <input type="number" id="input-qtd-${p.id}" class="form-control form-control-sm text-center mx-1" style="width: 100px;" step="0.001" min="0" max="${p.qtd}" value="${qtd}" onchange="atualizarQuantidadeInput(${p.id}, '${p.nome}')">
                        <button class="btn btn-outline-success btn-sm ms-1" ${!podeInc ? 'disabled' : ''} onclick="alterarQuantidade(${p.id}, '${p.nome}', ${incremento})">+</button>
                    <\/div>
                <\/td>
            <\/tr>`;
        } else {
            tbody.innerHTML += `<tr>
                <td>${p.nome} ${isCategoria2(p.nome) ? '<span class="coxa-sobrecoxa-badge">Coxa/Sobrecoxa</span>' : ''}<\/td>
                <td>R$ ${p.preco.toFixed(2)}<\/td>
                <td>${p.qtd}<\/td>
                <td class="text-center">
                    <button class="btn btn-outline-danger btn-sm" ${!podeDec ? 'disabled' : ''} onclick="alterarQuantidade(${p.id}, '${p.nome}', ${-incremento})">−</button>
                    <span class="mx-2 fw-bold">${formatarQuantidade(qtd, p.nome)}</span>
                    <button class="btn btn-outline-success btn-sm" ${!podeInc ? 'disabled' : ''} onclick="alterarQuantidade(${p.id}, '${p.nome}', ${incremento})">+</button>
                <\/td>
            <\/tr>`;
        }
    });
    atualizarValorTotal();
}

function alterarQuantidade(id, nome, delta) {
    const produto = produtosDia.find(p => p.id === id);
    let item = produtosSelecionados.find(p => p.produto_id === id);
    if (!item && delta > 0) {
        let qtdInicial = arredondarQuantidade(Math.abs(delta), nome);
        produtosSelecionados.push({ produto_id: id, nome, quantidade: qtdInicial });
    } else if (item) {
        let novaQtd = arredondarQuantidade(item.quantidade + delta, nome);
        if (novaQtd > produto.qtd) novaQtd = produto.qtd;
        if (novaQtd <= 0) produtosSelecionados = produtosSelecionados.filter(p => p.produto_id !== id);
        else item.quantidade = novaQtd;
    }
    renderizarItens();
    renderizarProdutos();
    atualizarValorTotal();
}

function renderizarItens() {
    const tbody = document.getElementById("itensPedido");
    tbody.innerHTML = "";
    produtosSelecionados.forEach(p => {
        tbody.innerHTML += `<tr>
            <td>${p.nome}<\/td>
            <td>${formatarQuantidade(p.quantidade, p.nome)}<\/td>
            <td>R$ ${calcularSubtotal(p).toFixed(2)}<\/td>
        <\/tr>`;
    });
}

async function criarPedido() {
    const cliente = document.getElementById("nomeCliente").value.trim().toUpperCase();
    if (!cliente) { alert("Nome obrigatório"); return; }
    if (produtosSelecionados.length === 0) { alert("Selecione produtos"); return; }

    // 🔥 OBTÉM O HORÁRIO (se vazio, usa o atual)
    let horario = document.getElementById("horarioPedido").value;
    if (!horario) {
        horario = obterHorarioAtual();
        addLog(`⏰ Usando horário atual: ${horario}`, 'info');
    } else {
        if (horario.split(':').length === 2) {
            horario = horario + ':00';
        }
        addLog(`⏰ Usando horário informado: ${horario}`, 'info');
    }

    for (const item of produtosSelecionados) {
        item.quantidade = arredondarQuantidade(item.quantidade, item.nome);
        if (item.quantidade <= 0) {
            alert(`Quantidade inválida para ${item.nome}`);
            return;
        }
    }

    const valorTotalCalculado = calcularValorTotal();

    try {
        // Primeiro: Cria o pedido principal
        const payloadPedido = {
            nome_cliente: cliente,
            horario: horario,
            produtos: produtosSelecionados.map(p => ({
                produto_id: p.produto_id,
                quantidade: p.quantidade
            }))
        };

        addLog(`📤 Enviando pedido: ${JSON.stringify(payloadPedido)}`, 'debug');

        const respPedido = await fetch(`${BASE_URL}/pedido`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payloadPedido)
        });

        const dataPedido = await respPedido.json();

        if (!respPedido.ok) {
            alert(dataPedido.erro || "Erro ao criar pedido");
            return;
        }

        addLog(`✅ Pedido criado! ID: ${dataPedido.pedido_id}`, 'info');

        // 🔥 Segundo: Registra cada produto na tabela produto_cliente com o horário
        for (const item of produtosSelecionados) {
            const payloadProdutoCliente = {
                cliente: cliente,
                produto: item.nome,
                qtd: item.quantidade,
                horario: horario  // 🔥 Envia o horário para a tabela produto_cliente
            };

            addLog(`📤 Registrando produto: ${item.nome} - Quantidade: ${item.quantidade} - Horário: ${horario}`, 'debug');

            const respProduto = await fetch(`${BASE_URL}/produtos_cliente`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payloadProdutoCliente)
            });

            if (!respProduto.ok) {
                const errorData = await respProduto.json();
                addLog(`⚠️ Erro ao registrar ${item.nome}: ${errorData.erro}`, 'warning');
            } else {
                addLog(`✅ Produto ${item.nome} registrado com sucesso`, 'info');
            }
        }

        alert(`✅ Pedido criado! ID: ${dataPedido.pedido_id} - Total: R$ ${dataPedido.valor_total.toFixed(2)} - Horário: ${horario}`);

        // Reset
        produtosSelecionados = [];
        document.getElementById("nomeCliente").value = "";
        document.getElementById("horarioPedido").value = "";
        renderizarItens();
        carregarProdutosDia();
        atualizarValorTotal();

    } catch (error) {
        alert("Erro de conexão");
        console.error(error);
    }
}

carregarProdutosDia();
</script>
</body>
</html>
