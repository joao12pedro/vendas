<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Home</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  padding: 30px;
}
.card {
  max-width: 800px;
  margin: auto;
  background: #fff;
  padding: 20px;
  border-radius: 8px;
}
button {
  padding: 6px 12px;
  cursor: pointer;
}
button:disabled {
  opacity: 0.5;
}
</style>
</head>

<body>

<div class="card">
  <h2>Criar Pedido</h2>

  <input id="nomeCliente" placeholder="Nome do cliente">
  <button onclick="criarPedido()">Criar Pedido</button>

  <p id="msg"></p>

  <hr>

  <h3>Produtos do Dia</h3>

  <table border="1" width="100%">
    <thead>
      <tr>
        <th>Produto</th>
        <th>Preço</th>
        <th>Qtd</th>
        <th>Ação</th>
      </tr>
    </thead>
    <tbody id="listaProdutos">
      <tr><td colspan="4">Carregando...</td></tr>
    </tbody>
  </table>
</div>

<script>
let pedidoCriado = false;

/* ================= NORMALIZAR NOME ================= */
function normalizarNome(nome) {
  return nome.trim().replace(/\s+/g, " ").toUpperCase();
}

/* ================= CRIAR PEDIDO ================= */
async function criarPedido() {
  const nome = normalizarNome(
    document.getElementById("nomeCliente").value
  );

  if (!nome) {
    alert("Digite o nome do cliente");
    return;
  }

  const res = await fetch("/pedido", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ nome_cliente: nome })
  });

  const data = await res.json();

  if (!res.ok) {
    alert(data.erro || "Erro ao criar pedido");
    return;
  }

  pedidoCriado = true;
  document.getElementById("msg").innerText =
    `Pedido criado para ${nome}`;
}

/* ================= LISTAR PRODUTOS DO DIA ================= */
async function carregarProdutosDia() {
  const res = await fetch("/produtos_dia");

  if (!res.ok) {
    console.error("Erro ao buscar produtos do dia");
    return;
  }

  const produtos = await res.json();
  const tbody = document.getElementById("listaProdutos");

  if (!Array.isArray(produtos) || produtos.length === 0) {
    tbody.innerHTML =
      "<tr><td colspan='4'>Nenhum produto disponível</td></tr>";
    return;
  }

  tbody.innerHTML = produtos.map(p => `
    <tr>
      <td>${p.nome}</td>
      <td>R$ ${Number(p.preco).toFixed(2)}</td>
      <td>${p.qtd}</td>
      <td>
        <button
          onclick="adicionarProduto('${p.nome}')"
          ${p.qtd <= 0 ? "disabled" : ""}
        >
          ${p.qtd <= 0 ? "Esgotado" : "Adicionar"}
        </button>
      </td>
    </tr>
  `).join("");
}

/* ================= ADICIONAR PRODUTO ================= */
async function adicionarProduto(nomeProduto) {
  if (!pedidoCriado) {
    alert("Crie o pedido primeiro");
    return;
  }

  const cliente = normalizarNome(
    document.getElementById("nomeCliente").value
  );

  const res = await fetch("/adicionar_item", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      cliente,
      produto: nomeProduto
    })
  });

  const data = await res.json();

  if (!res.ok) {
    alert(data.erro);
    return;
  }

  carregarProdutosDia();
}

/* INIT */
carregarProdutosDia();
</script>

</body>
</html>
